<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能简历初筛 Agent</title>
  <style>
    :root { --primary:#7c3aed; --bg:#f5f7fa; --card:#fff; --border:#e5e7eb; --text:#1f2937; --muted:#6b7280; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .layout { display: grid; grid-template-columns: 400px 1fr; gap: 20px; max-width: 1150px; margin: 0 auto; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
    label { display: block; font-size: 13px; margin: 12px 0 6px; color: var(--text); }
    input[type=file], textarea { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 14px; font-family: inherit; }
    textarea { min-height: 140px; resize: vertical; }
    button { margin-top: 16px; width: 100%; padding: 10px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    button:disabled { background: #c4b5fd; cursor: not-allowed; }
    .msg { font-size: 13px; margin-top: 12px; white-space: pre-wrap; }
    .msg.error { color: #b91c1c; } .msg.ok { color: #047857; }
    .badge { display: inline-block; padding: 4px 14px; border-radius: 999px; font-size: 13px; font-weight: bold; }
    .badge.pass { background:#dcfce7; color:#15803d; }
    .badge.wait { background:#fef3c7; color:#b45309; }
    .badge.drop { background:#fee2e2; color:#b91c1c; }
    .kv { display: grid; grid-template-columns: 96px 1fr; row-gap: 10px; font-size: 14px; margin-top: 8px; }
    .kv b { color: var(--muted); font-weight: normal; }
    .chips span { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 10px; border-radius: 999px; font-size: 12px; background:#f3e8ff; color:#7c3aed; }
    .chips span.miss { background:#fef2f2; color:#b91c1c; }
    ol { margin: 6px 0 0 20px; font-size: 14px; line-height: 1.8; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: normal; background:#f9fafb; }
    .muted { color: var(--muted); }
    a { color: var(--primary); }
  </style>
</head>
<body>
  <h1>📄 智能简历初筛 Agent</h1>
  <div class="sub">规则引擎打底 + DeepSeek Harness 编排 LLM 复核 · 硬性条件一票否决 · 评分全程可解释</div>

  <div class="layout">
    <div class="card">
      <h2>提交初筛任务</h2>
      <label>简历文件（.pdf / .docx / .txt）</label>
      <input type="file" id="resumeFile" accept=".pdf,.docx,.txt">
      <label>JD 文件（.txt，可选）</label>
      <input type="file" id="jdFile" accept=".txt,.md">
      <label>或直接粘贴 JD 文本</label>
      <textarea id="jdText" placeholder="粘贴岗位 JD……（与 JD 文件二选一）"></textarea>
      <button id="submitBtn" onclick="submitEval()">开始初筛</button>
      <div class="msg muted">示例数据：python tools/sample_data.py（data/samples/ 含 1 份简历 + 2 个 JD）</div>
      <div class="msg" id="statusMsg"></div>
    </div>

    <div class="card">
      <h2>Agent 初筛结果</h2>
      <div class="msg muted" id="resultBox">提交后展示：结论、规则分 vs 语义复核分、命中/缺失技能、优点疑虑与面试问题。</div>
    </div>
  </div>

  <script>
    function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function chips(list, miss) {
      if (!list || !list.length) return '<span class="muted">-</span>';
      return '<div class="chips">' + list.map(x => `<span class="${miss ? 'miss' : ''}">${esc(x)}</span>`).join('') + '</div>';
    }

    function renderResult(d) {
      const a = d.agent_json || {};
      const r = d.rule_score || {};
      const cls = a.verdict === '推荐面试' ? 'pass' : (a.verdict === '待定' ? 'wait' : 'drop');
      const badge = `<span class="badge ${cls}">${esc(a.verdict || '未知')}</span>`;
      const hard = (r.hard_checks || []).map(c =>
        `<tr><td>${esc(c.note)}</td><td>${c.passed ? '✅ 通过' : '❌ 不通过'}</td></tr>`).join('');
      const qs = (a.interview_questions || []).map(q => `<li>${esc(q)}</li>`).join('');
      return `<div class="kv">
        <b>结论</b><div>${badge}</div>
        <b>总分</b><div><b>${esc(a.total_score ?? '-')}</b>（规则分 ${esc(r.total ?? '-')} + 语义复核调整）</div>
        <b>命中技能</b>${chips(a.matched_skills || r.matched_skills)}
        <b>缺失技能</b>${chips(a.missing_skills || r.missing_skills, true)}
        <b>优点</b><div>${(a.strengths || []).map(esc).join('；') || '-'}</div>
        <b>疑虑</b><div>${(a.concerns || []).map(esc).join('；') || '-'}</div>
        <b>面试问题</b><div><ol>${qs || '<li>-</li>'}</ol></div>
        <b>摘要</b><div>${esc(a.summary || '-')}</div>
        <b>报告</b><div>${d.report_csv ? `<a href="${esc(d.report_csv)}">CSV 报告</a> · <a href="${esc(d.report_json)}">JSON 报告</a>` : '-'}</div>
      </div>
      ${hard ? '<h3 style="margin-top:14px">硬性条件检查（规则引擎）</h3><table><tr><th>条件</th><th>结果</th></tr>' + hard + '</table>' : ''}`;
    }

    async function submitEval() {
      const resume = document.getElementById('resumeFile').files[0];
      const jdFile = document.getElementById('jdFile').files[0];
      const jdText = document.getElementById('jdText').value.trim();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('statusMsg');
      if (!resume) { msg.className = 'msg error'; msg.textContent = '请先选择简历文件'; return; }
      if (!jdFile && !jdText) { msg.className = 'msg error'; msg.textContent = '请上传 JD 文件或粘贴 JD 文本'; return; }
      btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Agent 正在初筛（解析简历 → 解析JD → 规则打分 → 语义复核 → 生成面试问题），请稍候……';
      const fd = new FormData();
      fd.append('resume', resume);
      if (jdFile) fd.append('jd_file', jdFile);
      if (jdText) fd.append('jd_text', jdText);
      try {
        const res = await fetch('/api/evaluate', { method: 'POST', body: fd });
        const data = await res.json();
        if (data.ok) {
          msg.className = 'msg ok'; msg.textContent = '✅ ' + data.message;
          document.getElementById('resultBox').innerHTML = renderResult(data);
        } else {
          msg.className = 'msg error'; msg.textContent = '⚠️ ' + data.message;
        }
      } catch (e) {
        msg.className = 'msg error'; msg.textContent = '请求失败：' + e;
      } finally { btn.disabled = false; }
    }
  </script>
</body>
</html>
